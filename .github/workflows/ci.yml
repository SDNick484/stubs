name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install "ruff==0.16.9" "shellcheck-py==0.11.0.1"
      - run: ruff check
      - run: shellcheck -s sh installer/setup-head.sh installer/build.sh ops/stubs-backup
      - name: node --check static/js/*.js
        run: for f in static/js/*.js; do node --check "$f"; done
      - name: node --test tests/*.test.mjs
        run: node --test tests/*.test.mjs
      - name: Build the installer
        run: sh installer/build.sh && sh -n dist/setup-stubs.sh

  ui:
    # The browser smoke tests (tests/test_*_ui.py, by glob) at phone width. STUBS_UI_REQUIRED=1 turns a missing
    # Playwright or Chromium into a failure, and the summary is checked so no test can pass by skipping.
    name: UI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt "playwright==1.65.2"
      - run: python -m playwright install --with-deps chromium
      - name: pytest tests/test_*_ui.py (fails on any skip)
        env:
          STUBS_UI_REQUIRED: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/test_*_ui.py | tee ui.log
          if grep -Eq "[0-9]+ skipped" ui.log; then echo "UI tests skipped: see above"; exit 1; fi

  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # The browser tests run in the UI smoke job, the MCP server's in the MCP job.
      - run: python -m pytest -q -rs --ignore-glob='tests/test_*_ui.py' --ignore-glob='tests/test_mcp_*.py'

  alpine:
    # Production parity: Alpine's own py3-* packages, musl and BusyBox (the installer build runs on its sh and tar).
    name: Alpine latest
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      # git so actions/checkout makes a real clone: tests/test_hygiene.py lists files with `git ls-files`.
      - run: apk add --no-cache python3 py3-flask py3-gunicorn py3-jwt py3-cryptography py3-pytest sqlite nodejs git
      - uses: actions/checkout@v7
      # The checkout is owned by another user inside the container; git refuses it without this.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 -m pytest -q -rs --ignore-glob='tests/test_*_ui.py' --ignore-glob='tests/test_mcp_*.py'
      - run: node --test tests/*.test.mjs
      - run: for f in static/js/*.js; do node --check "$f"; done
      - run: sh installer/build.sh && sh -n dist/setup-stubs.sh

  mcp:
    # The MCP server's tests (tests/test_mcp_*.py, post-v1 #46) with requirements-mcp.txt, the stubs-mcp venv's
    # packages, which the app's own jobs don't install (they leave these files out). httpx is for Starlette's
    # TestClient. STUBS_MCP_REQUIRED=1 turns a missing package into a failure, and the summary is checked so no test
    # can pass by skipping.
    name: MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-mcp.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-mcp.txt "httpx==0.28.1"
      - name: pytest tests/test_mcp_*.py (fails on any skip)
        env:
          STUBS_MCP_REQUIRED: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/test_mcp_*.py | tee mcp.log
          if grep -Eq "[0-9]+ skipped" mcp.log; then echo "MCP tests skipped: see above"; exit 1; fi
